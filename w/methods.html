<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيداع | MOBCASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Kufi Arabic', sans-serif; 
            background-color: #ffffff; 
            margin: 0;
            padding-top: 10px;
        }

        .toolbar { 
            background: white; 
            padding: 10px 25px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .header-title { font-size: 24px; font-weight: 900; }
        .close-btn { font-size: 26px; color: #cbd5e1; cursor: pointer; }

        .method-card { 
            background: #f1f3f6; 
            border-radius: 1.2rem; 
            display: flex;
            align-items: center;
            justify-content: flex-end; 
            padding: 15px;
            height: 105px; 
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .method-card:active { transform: scale(0.96); }
        
        .bank-content {
            display: flex;
            flex-direction: column; 
            align-items: center; 
            gap: 6px;
            min-width: 90px;
        }

        .icon-container {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-img { 
            max-height: 100%;
            max-width: 85px;
            width: auto;
            object-fit: contain;
        }

        .icon-inwi {
            max-height: 55px;
            max-width: 120px;
        }
        
        .bank-name {
            font-size: 11px;
            font-weight: 800;
            color: #1a1a1a;
            white-space: nowrap;
            text-align: center;
        }
    </style>
</head>
<body class="antialiased">

    <div class="toolbar">
        <span class="close-btn" onclick="if(window.parent.closeSheet) window.parent.closeSheet();">✕</span>
        <h1 class="header-title">إيداع</h1>
    </div>

    <main class="max-w-[500px] mx-auto px-4 mt-4 pb-10">
        <div class="grid grid-cols-2 gap-3">
            
            <div onclick="goToPayment('recharge_id')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/sdpXq9jP/IMG-7788.png" class="icon-img"></div>
                    <span class="bank-name">Recharge par ID</span>
                </div>
            </div>

            <div onclick="goToPayment('cih')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/k2JSthF7/IMG-7787.png" class="icon-img"></div>
                    <span class="bank-name">CIH Bank</span>
                </div>
            </div>

            <div onclick="goToPayment('cashplus')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/qYyrgLMj/IMG-7793.png" class="icon-img"></div>
                    <span class="bank-name">Cash Plus</span>
                </div>
            </div>

            <div onclick="goToPayment('tijari')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/bjJhd9Q2/IMG-7789.png" class="icon-img"></div>
                    <span class="bank-name">Attijari Bank</span>
                </div>
            </div>

            <div onclick="goToPayment('barid')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/gbhF5WQy/IMG-7795.png" class="icon-img"></div>
                    <span class="bank-name">Al Barid Bank</span>
                </div>
            </div>

            <div onclick="goToPayment('baridpay')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/4R6bwZGB/IMG-7794.png" class="icon-img"></div>
                    <span class="bank-name">Barid Pay</span>
                </div>
            </div>

            <div onclick="goToPayment('lbankalik')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/MypbZXsJ/IMG-7798.png" class="icon-img"></div>
                    <span class="bank-name">Lbanka lik</span>
                </div>
            </div>

            <div onclick="goToPayment('boa')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/nqDdGrHV/IMG-7806.png" class="icon-img"></div>
                    <span class="bank-name">Bank Of Africa</span>
                </div>
            </div>

            <div onclick="goToPayment('chaabipay')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/9kXfh6rB/IMG-7800.png" class="icon-img"></div>
                    <span class="bank-name">Chaabi Pay</span>
                </div>
            </div>

            <div onclick="goToPayment('chaabi')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/1G9TLMPc/IMG-7799.png" class="icon-img"></div>
                    <span class="bank-name">Banque Populaire</span>
                </div>
            </div>

            <div onclick="goToPayment('damane')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/4Z3bWt06/IMG-7802.png" class="icon-img"></div>
                    <span class="bank-name">Damane Pay</span>
                </div>
            </div>

            <div onclick="goToPayment('orange')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/BHd0kCdL/IMG-7801.png" class="icon-img"></div>
                    <span class="bank-name">Orange Money</span>
                </div>
            </div>

            <div onclick="goToPayment('inwi')" class="method-card">
                <div class="bank-content">
                    <div class="icon-container"><img src="https://i.ibb.co/d41H2rzd/IMG-7804.png" class="icon-img icon-inwi"></div>
                    <span class="bank-name">Inwi Money</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        function goToPayment(pageName) {
            // جلب البيانات القادمة من index.html
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || '';
            const userId = urlParams.get('id') || '';

            // التوجيه لصفحة البنك الخاصة (مثلاً cih.html) مع تمرير البيانات
            window.location.href = `${pageName}.html?amount=${amount}&id=${userId}`;
        }
    </script>
</body>
</html>
